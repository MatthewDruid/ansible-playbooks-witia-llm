global
    chroot /var/empty

    user nobody
    group nobody

    daemon

    hard-stop-after 5m

    #log stderr local0 info
    log 127.0.0.1 daemon info

    # intermediate configuration
    ssl-default-bind-curves X25519:prime256v1:secp384r1
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options prefer-client-ciphers ssl-min-ver TLSv1.2 no-tls-tickets

    ssl-default-server-curves X25519:prime256v1:secp384r1
    ssl-default-server-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-server-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-server-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    mode http
    option httplog
    log global

    timeout client 60s
    timeout server 60s
    timeout connect 5s
    timeout http-keep-alive 2m
    timeout http-request 10s
    timeout queue 15s
    timeout tunnel 4h
    timeout check 60s

frontend llm-frontend
    bind :80
    bind :443 ssl crt /usr/local/etc/haproxy/certs/

#.if feature(QUIC)
#    bind quic4@:443 ssl crt /usr/local/etc/haproxy/certs/ allow-0rtt
#    http-response add-header alt-svc 'h3=":443"; ma=60'
#.endif

    # HSTS (63072000 seconds)
    http-response set-header Strict-Transport-Security "max-age=63072000; includeSubDomains"
    http-request redirect scheme https code 308 unless { ssl_fc }

	# silently ignore connect probes and pre-connect without request
	option http-ignore-probes

	# enable HTTP compression of text contents
	compression algo deflate gzip
	compression type text/ application/javascript application/xhtml+xml image/x-icon

	# enable HTTP caching of any cacheable content
    http-request  cache-use cache
    http-response cache-store cache

    use_backend litellm-backend if { hdr(host) -i litellm.example }
    use_backend openwebui-backend if { hdr_end(host) -i ai.example }

    default_backend openwebui-backend

cache cache
	total-max-size 200        # RAM cache size in megabytes
	max-object-size 10485760  # max cacheable object size in bytes
	max-age 3600              # max cache duration in seconds
	process-vary on           # handle the Vary header (otherwise don't cache)

backend litellm-backend
    mode http

	# abort if the client clicks on stop.
	option abortonclose
    option forwarded

    option httpchk
    http-check send meth GET uri /health/liveliness ver HTTP/1.1 hdr host litellm.example
    http-check expect status 200

    server litellm-app01 127.0.0.1:4000 check inter 5s fall 3 rise 2

backend openwebui-backend
    mode http

    option abortonclose
    option forwarded

    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr host ai.example
    http-check expect status 200

    server openwebui-app01 127.0.0.1:8080

