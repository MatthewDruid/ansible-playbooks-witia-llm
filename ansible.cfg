[defaults]
collections_path = ./collections

callback_result_format = yaml
bin_ansible_callbacks = true

inventory = ./inventory
roles_path = ./roles

vault_password_file = .vault_pass

retry_files_enabled = false

ask_pass = false

[connection]
pipelining = true

[privilege_escalation]
become = false
become_user = root
become_ask_pass = false

[ssh_connection]
pipelining = true

